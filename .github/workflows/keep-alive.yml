name: Keep Vercel Alive

on:
  schedule:
    # Setiap Minggu jam 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  redeploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel Redeploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          curl -X POST "https://api.vercel.com/v1/integrations/deploy/$VERCEL_PROJECT_ID/$VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"target":"production"}'